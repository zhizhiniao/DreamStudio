<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self'"><title>造梦室 · 软件更新</title><link rel="stylesheet" href="desktop.css"></head><body><main><header><img src="brand/dreamroom.svg" alt="造梦室"><div><h1>软件更新</h1><p id="current">造梦室</p></div></header><section aria-live="polite"><h2 id="status">正在读取版本信息…</h2><p id="message"></p><p id="last"></p></section><div class="actions"><button id="check" class="primary">检查更新</button><button id="download" hidden>下载新版</button><button id="notes-link" hidden>发行说明</button><button id="skip" hidden>跳过此版本</button></div><label class="automatic"><input type="checkbox" id="automatic"> 自动检查新版本</label><pre id="notes" hidden></pre><details id="source"><summary>更新来源</summary><label for="repository">GitHub 仓库</label><div class="source-row"><input id="repository" placeholder="用户名/仓库名" autocomplete="off"><button id="save">保存</button></div><p>公开发布前需将仓库地址写入安装包。仅发布源码或 Git 标签不会触发更新提示。</p></details><footer>造梦室 · 基于 Y2A-Auto</footer></main><script src="updates-ui.js"></script></body></html>
